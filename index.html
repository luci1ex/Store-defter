<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b14">
  <title>Botspanel</title>
  <style>
    :root{--bg:#080b14;--line:#252e43;--text:#eef2ff;--muted:#9aa7c2;--purple:#8b5cf6;--cyan:#22d3ee}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 90% -10%,#33205e66,transparent 60%),radial-gradient(700px 400px at 0% 40%,#07566b33,transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
    .card{width:min(420px,100%);text-align:center;background:#111827dd;border:1px solid var(--line);border-radius:24px;padding:32px 24px;box-shadow:0 25px 80px #0008}
    .logo{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--cyan));color:#07101a;font-weight:900;font-size:20px}
    h1{margin:0 0 6px;font-size:24px}p{margin:0 0 22px;color:var(--muted);line-height:1.8}
    a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:linear-gradient(110deg,var(--purple),#5b7cfa 55%,var(--cyan));color:#06101b;font-weight:800;text-decoration:none}
    a.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .note{margin-top:16px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">BP</div>
    <h1>Botspanel</h1>
    <p>جاري تحويلك إلى لوحة الإدارة...</p>
    <a class="btn" id="go" href="http://169.58.150.64:30002">فتح اللوحة</a>
    <div class="note">إذا ما تحوّلت تلقائياً، اضغط الزر.</div>
  </main>
  <script>
    // تحويل تلقائي، مع إمكانية إيقافه بإضافة ?stay بنهاية الرابط
    if (!location.search.includes("stay")) setTimeout(() => location.replace(document.getElementById("go").href), 800);
  </script>
</body>
</html>
