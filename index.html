<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F0B1A;
    --surface:#181228;
    --surface2:#211A38;
    --border:#332A54;
    --accent:#7C5CFC;
    --accent-soft:#7C5CFC22;
    --gold:#F5B94D;
    --danger:#FF5C7A;
    --danger-soft:#FF5C7A1E;
    --text:#EDEAFB;
    --muted:#9C93BE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 20% 0%, #1B1435 0%, #0F0B1A 55%);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;}

  /* ---------- Auth screen ---------- */
  #authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .authCard{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px 26px;
  }
  .authCard .brand{
    font-size:22px;
    font-weight:700;
    margin:0 0 4px;
    background:linear-gradient(90deg,#B8A6FF,#7C5CFC);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .authCard p.sub{color:var(--muted);margin:0 0 24px;font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .btn{
    width:100%;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:transform .08s ease, background .15s ease;
  }
  .btn:hover{background:#8E70FF;}
  .btn:active{transform:scale(0.98);}
  .btn.ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn.danger{background:var(--danger);}
  .switchRow{text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted);}
  .switchRow a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
  #authError{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none;}
  header.topbar{
    padding:22px 0 14px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  header.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header.topbar .brand{font-size:19px;font-weight:700;}
  .userChip{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--muted);
  }
  .roleTag{
    background:var(--accent-soft);
    color:#B8A6FF;
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
  }
  .signOutBtn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:22px;
  }
  nav.tabs button{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 16px;
    border-radius:30px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h3{margin:0 0 16px;font-size:15px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .profitPreview{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface2);
    border-radius:10px;
    padding:12px 14px;
    margin:14px 0;
    font-size:14px;
  }
  .profitPreview b{font-size:18px;}
  .profitPreview b.pos{color:var(--gold);}
  .profitPreview b.neg{color:var(--danger);}

  .totalsBar{
    display:flex;justify-content:space-between;gap:10px;
    background:var(--surface2);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
  }
  .totalsBar b{color:var(--text);font-size:16px;display:block;font-family:'Sora',sans-serif;}

  .orderRow{
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .orderRow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .orderRow .nums{color:var(--muted);}
  .orderRow .profitVal{font-weight:700;font-family:'Sora',sans-serif;}
  .orderRow .profitVal.pos{color:var(--gold);}
  .orderRow .profitVal.neg{color:var(--danger);}
  .orderRow .meta{margin-top:6px;color:var(--muted);font-size:12px;}
  .orderRow .note{margin-top:6px;font-size:13px;color:var(--text);}
  .orderRow .actions{margin-top:8px;}
  .delBtn{
    background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;
    padding:0;font-family:'Inter',sans-serif;
  }
  .emptyState{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px;}

  .grandCard{
    background:linear-gradient(135deg,#241C42,#181228);
    border:1px solid var(--accent);
  }
  .grandRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .grandRow:last-child{border-bottom:none;}
  .grandRow b{font-family:'Sora',sans-serif;color:var(--gold);}
</style>
</head>
<body>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="authCard">
    <p class="brand">دفتر المتجر</p>
    <p class="sub" id="authSub">سجل دخولك لمتابعة الطلبات والأرباح</p>

    <div class="field">
      <label>الإيميل</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>الباسورد</label>
      <input type="password" id="passInput" placeholder="••••••••">
    </div>
    <button class="btn" id="authSubmitBtn">دخول</button>
    <div id="authError"></div>
    <div class="switchRow" id="switchRow">
      ماعندك حساب؟ <a id="toSignup">سوي حساب جديد</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="wrap">
    <header class="topbar">
      <div class="row">
        <div class="brand">دفتر المتجر</div>
        <div class="userChip">
          <span id="userEmailLabel"></span>
          <span class="roleTag" id="roleLabel"></span>
          <button class="signOutBtn" id="signOutBtn">خروج</button>
        </div>
      </div>
    </header>

    <nav class="tabs" id="tabsNav"></nav>

    <div id="sectionContent"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot,
  query, where, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ======================================================================
   1) بدل هاي البيانات بمعلومات مشروع Firebase الجديد الخاص بيك
   ====================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBqgxlOomstd75tKgeK4l6IOuxMPQtJB_E",
  authDomain: "lucifer-server-log.firebaseapp.com",
  projectId: "lucifer-server-log",
  storageBucket: "lucifer-server-log.firebasestorage.app",
  messagingSenderId: "575252872989",
  appId: "1:575252872989:web:10a2b1a30e124670cbebf4"
};

/* 2) حط إيميلك هنا حتى تنعطى صلاحية "مدير" (تشوف كل الطلبات) */
const MANAGER_EMAILS = ["e3li@outlook.sa"];

/* ====================================================================== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SECTIONS = [
  { id: "nitro",    label: "نيتروات" },
  { id: "effects",  label: "افكتات" },
  { id: "posts",    label: "بوستات" },
  { id: "accounts", label: "حسابات", extraField: true }
];

let currentUser = null;
let isManager = false;
let activeSection = "nitro";
let unsubscribeOrders = null;
let currentOrders = [];

/* ---------------- Auth screen logic ---------------- */
let mode = "login"; // or "signup"
const authSub = document.getElementById("authSub");
const authSubmitBtn = document.getElementById("authSubmitBtn");
const switchRow = document.getElementById("switchRow");
const authError = document.getElementById("authError");

document.getElementById("toSignup").addEventListener("click", () => {
  mode = mode === "login" ? "signup" : "login";
  if (mode === "signup") {
    authSub.textContent = "سوي حساب جديد للانضمام للتيم";
    authSubmitBtn.textContent = "إنشاء الحساب";
    switchRow.innerHTML = 'عندك حساب؟ <a id="toSignup2">دخول</a>';
    document.getElementById("toSignup2").addEventListener("click", () => location.reload());
  }
});

authSubmitBtn.addEventListener("click", async () => {
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passInput").value;
  authError.textContent = "";
  if (!email || !pass) { authError.textContent = "لازم تعبي الإيميل والباسورد"; return; }
  try {
    if (mode === "login") {
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      await createUserWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    authError.textContent = translateAuthError(e.code);
  }
});

function translateAuthError(code) {
  const map = {
    "auth/invalid-email": "الإيميل غير صحيح",
    "auth/user-not-found": "ماكو حساب بهذا الإيميل",
    "auth/wrong-password": "الباسورد غلط",
    "auth/invalid-credential": "بيانات الدخول غلط",
    "auth/email-already-in-use": "هذا الإيميل مسجل من قبل",
    "auth/weak-password": "الباسورد لازم 6 أحرف أو أكثر"
  };
  return map[code] || "صار خطأ، حاول مرة ثانية";
}

document.getElementById("signOutBtn").addEventListener("click", () => signOut(auth));

/* ---------------- Auth state ---------------- */
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    isManager = MANAGER_EMAILS.includes(user.email);
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("userEmailLabel").textContent = user.email;
    document.getElementById("roleLabel").textContent = isManager ? "مدير" : "عضو";
    buildTabs();
    renderSection();
  } else {
    document.getElementById("authScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    if (unsubscribeOrders) unsubscribeOrders();
  }
});

/* ---------------- Tabs ---------------- */
function buildTabs() {
  const nav = document.getElementById("tabsNav");
  nav.innerHTML = "";
  const tabList = [...SECTIONS];
  if (isManager) tabList.push({ id: "totals", label: "الإجمالي" });
  tabList.forEach(s => {
    const btn = document.createElement("button");
    btn.textContent = s.label;
    btn.className = s.id === activeSection ? "active" : "";
    btn.addEventListener("click", () => {
      activeSection = s.id;
      buildTabs();
      renderSection();
    });
    nav.appendChild(btn);
  });
}

/* ---------------- Section rendering ---------------- */
function renderSection() {
  const content = document.getElementById("sectionContent");
  if (unsubscribeOrders) unsubscribeOrders();

  if (activeSection === "totals") {
    content.innerHTML = `<div class="card grandCard"><h3>الربح الإجمالي لكل الأقسام</h3><div id="grandBox">جاري التحميل...</div></div>`;
    renderGrandTotals();
    return;
  }

  const section = SECTIONS.find(s => s.id === activeSection);
  content.innerHTML = `
    <div class="card">
      <h3>إضافة طلب — ${section.label}</h3>
      ${section.extraField ? `
      <div class="field">
        <label>نوع الحساب</label>
        <input type="text" id="accountTypeInput" placeholder="مثلاً: حساب PUBG، حساب Netflix...">
      </div>` : ""}
      <div class="grid2">
        <div class="field">
          <label>سعر التكلفة</label>
          <input type="number" id="costInput" placeholder="0">
        </div>
        <div class="field">
          <label>سعر البيع</label>
          <input type="number" id="sellInput" placeholder="0">
        </div>
      </div>
      <div class="field">
        <label>ملاحظة (اختياري)</label>
        <input type="text" id="noteInput" placeholder="اسم الزبون، تفاصيل إضافية...">
      </div>
      <div class="profitPreview">
        <span>الربح</span>
        <b id="profitPreviewVal" class="pos">0</b>
      </div>
      <button class="btn" id="addOrderBtn">إضافة الطلب</button>
    </div>

    <div class="totalsBar" id="sectionTotals">
      <div><b id="totalCount">0</b>عدد الطلبات</div>
      <div><b id="totalProfit">0</b>مجموع الربح</div>
    </div>

    <div id="orderList"></div>
  `;

  const costEl = document.getElementById("costInput");
  const sellEl = document.getElementById("sellInput");
  const previewEl = document.getElementById("profitPreviewVal");

  function updatePreview() {
    const c = parseFloat(costEl.value) || 0;
    const s = parseFloat(sellEl.value) || 0;
    const p = s - c;
    previewEl.textContent = p.toLocaleString();
    previewEl.className = p >= 0 ? "pos" : "neg";
  }
  costEl.addEventListener("input", updatePreview);
  sellEl.addEventListener("input", updatePreview);

  document.getElementById("addOrderBtn").addEventListener("click", async () => {
    const cost = parseFloat(costEl.value);
    const sell = parseFloat(sellEl.value);
    if (isNaN(cost) || isNaN(sell)) { alert("لازم تكتب سعر التكلفة وسعر البيع"); return; }
    const note = document.getElementById("noteInput").value.trim();
    const accountType = section.extraField ? document.getElementById("accountTypeInput").value.trim() : null;

    await addDoc(collection(db, "orders"), {
      section: section.id,
      cost, sell,
      profit: sell - cost,
      note: note || null,
      accountType: accountType || null,
      createdBy: currentUser.email,
      createdByUid: currentUser.uid,
      createdAt: serverTimestamp()
    });

    costEl.value = ""; sellEl.value = ""; document.getElementById("noteInput").value = "";
    if (section.extraField) document.getElementById("accountTypeInput").value = "";
    updatePreview();
  });

  subscribeToOrders(section);
}

function subscribeToOrders(section) {
  let q;
  if (isManager) {
    q = query(collection(db, "orders"), where("section", "==", section.id), orderBy("createdAt", "desc"));
  } else {
    q = query(collection(db, "orders"),
      where("section", "==", section.id),
      where("createdByUid", "==", currentUser.uid),
      orderBy("createdAt", "desc"));
  }
  unsubscribeOrders = onSnapshot(q, (snap) => {
    currentOrders = [];
    snap.forEach(d => currentOrders.push({ id: d.id, ...d.data() }));
    renderOrderList(section);
  });
}

function renderOrderList(section) {
  const listEl = document.getElementById("orderList");
  const totalCountEl = document.getElementById("totalCount");
  const totalProfitEl = document.getElementById("totalProfit");
  if (!listEl) return;

  const totalProfit = currentOrders.reduce((sum, o) => sum + (o.profit || 0), 0);
  totalCountEl.textContent = currentOrders.length;
  totalProfitEl.textContent = totalProfit.toLocaleString();

  if (currentOrders.length === 0) {
    listEl.innerHTML = `<div class="emptyState">ماكو طلبات مسجلة بعد بهذا القسم</div>`;
    return;
  }

  listEl.innerHTML = currentOrders.map(o => {
    const isPos = o.profit >= 0;
    const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString("ar-IQ") : "";
    const canDelete = isManager || o.createdByUid === currentUser.uid;
    return `
      <div class="orderRow">
        <div class="top">
          <div class="nums">تكلفة ${o.cost.toLocaleString()} · بيع ${o.sell.toLocaleString()}</div>
          <div class="profitVal ${isPos ? "pos" : "neg"}">${o.profit.toLocaleString()}</div>
        </div>
        ${o.accountType ? `<div class="note">نوع الحساب: ${escapeHtml(o.accountType)}</div>` : ""}
        ${o.note ? `<div class="note">${escapeHtml(o.note)}</div>` : ""}
        <div class="meta">${date}${isManager ? " · " + o.createdBy : ""}</div>
        ${canDelete ? `<div class="actions"><button class="delBtn" data-id="${o.id}">حذف</button></div>` : ""}
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".delBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (confirm("متأكد تريد تحذف هذا الطلب؟")) {
        await deleteDoc(doc(db, "orders", btn.dataset.id));
      }
    });
  });
}

/* ---------------- Grand totals (manager only) ---------------- */
function renderGrandTotals() {
  const box = document.getElementById("grandBox");
  const unsubs = [];
  const totals = {};
  let grand = 0;

  SECTIONS.forEach(s => {
    const q = query(collection(db, "orders"), where("section", "==", s.id));
    const unsub = onSnapshot(q, (snap) => {
      let sum = 0, count = 0;
      snap.forEach(d => { sum += d.data().profit || 0; count++; });
      totals[s.id] = { sum, count, label: s.label };
      grand = Object.values(totals).reduce((a, t) => a + t.sum, 0);
      draw();
    });
    unsubs.push(unsub);
  });
  unsubscribeOrders = () => unsubs.forEach(u => u());

  function draw() {
    let html = "";
    SECTIONS.forEach(s => {
      const t = totals[s.id];
      if (!t) return;
      html += `<div class="grandRow"><span>${t.label} (${t.count} طلب)</span><b>${t.sum.toLocaleString()}</b></div>`;
    });
    html += `<div class="grandRow" style="border-top:2px solid var(--accent);margin-top:6px;padding-top:12px;"><span>الإجمالي الكلي</span><b>${grand.toLocaleString()}</b></div>`;
    box.innerHTML = html;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
