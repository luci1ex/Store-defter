<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دفتر المتجر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0805;
    --surface:#161109;
    --surface2:#1F1A0F;
    --border:#3A2F17;
    --accent:#F5B60D;
    --accent-soft:#F5B60D22;
    --accent-ink:#161109;
    --gold:#FFD447;
    --danger:#FF5C7A;
    --danger-soft:#FF5C7A1E;
    --text:#F3EEE4;
    --muted:#A79A82;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 18% -6%, #2B2107 0%, transparent 45%),
      radial-gradient(circle at 100% 10%, #241C09 0%, transparent 40%),
      #0A0805;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    position:relative;
  }
  #starsCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }
  #authScreen, #app{position:relative;z-index:1;}
  h1,h2,h3,.brand{font-family:'Sora',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:0 18px;}

  .logoImg{
    width:46px;height:46px;border-radius:12px;object-fit:cover;
    box-shadow:0 0 0 1px var(--border), 0 4px 18px #F5B60D2E;
  }
  .brandRow{display:flex;align-items:center;gap:12px;}

  /* ---------- Auth screen ---------- */
  #authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .authCard{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:32px 26px;
  }
  .authCard .brand{
    font-size:22px;
    font-weight:700;
    margin:0;
    background:linear-gradient(90deg,#FFFFFF,#F5B60D);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .authCard .brandRow{margin-bottom:4px;justify-content:center;}
  .authCard .subBrand{
    text-align:center;color:var(--muted);font-size:11px;
    letter-spacing:.14em;margin:0 0 22px;font-family:'Sora',sans-serif;
  }
  .authCard p.sub{color:var(--muted);margin:0 0 24px;font-size:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input, .field select{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px 13px;
    font-size:15px;
    font-family:'Inter',sans-serif;
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent);border-color:var(--accent);}
  .btn{
    width:100%;
    background:linear-gradient(180deg,#FFCB33,#F5B60D);
    color:var(--accent-ink);
    border:none;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);}
  .btn:active{transform:scale(0.98);}
  .btn.ghost{
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .btn.danger{background:var(--danger);}
  .switchRow{text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted);}
  .switchRow a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600;}
  #authError{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}

  /* ---------- App shell ---------- */
  #app{display:none;}
  header.topbar{
    padding:22px 0 14px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  header.topbar .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header.topbar .brand{font-size:19px;font-weight:700;}
  .userChip{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--muted);
  }
  .roleTag{
    background:var(--accent-soft);
    color:var(--gold);
    padding:3px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:600;
  }
  .signOutBtn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    margin-bottom:22px;
  }
  nav.tabs button{
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 16px;
    border-radius:30px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:linear-gradient(180deg,#FFCB33,#F5B60D);
    border-color:var(--accent);
    color:var(--accent-ink);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
  }
  .card h3{margin:0 0 16px;font-size:15px;font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .profitPreview{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--surface2);
    border-radius:10px;
    padding:12px 14px;
    margin:14px 0;
    font-size:14px;
  }
  .profitPreview b{font-size:18px;}
  .profitPreview b.pos{color:var(--gold);}
  .profitPreview b.neg{color:var(--danger);}

  .totalsBar{
    display:flex;justify-content:space-between;gap:10px;
    background:var(--surface2);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
  }
  .totalsBar b{color:var(--text);font-size:16px;display:block;font-family:'Sora',sans-serif;}

  .orderRow{
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 15px;
    margin-bottom:10px;
    font-size:13.5px;
  }
  .orderRow .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .orderRow .nums{color:var(--muted);}
  .orderRow .profitVal{font-weight:700;font-family:'Sora',sans-serif;}
  .orderRow .profitVal.pos{color:var(--gold);}
  .orderRow .profitVal.neg{color:var(--danger);}
  .orderRow .meta{margin-top:6px;color:var(--muted);font-size:12px;}
  .orderRow .note{margin-top:6px;font-size:13px;color:var(--text);}
  .orderRow .actions{margin-top:8px;}
  .delBtn{
    background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;
    padding:0;font-family:'Inter',sans-serif;
  }
  .emptyState{color:var(--muted);text-align:center;padding:30px 10px;font-size:13.5px;}

  .grandCard{
    background:linear-gradient(135deg,#241C09,#161109);
    border:1px solid var(--accent);
  }
  .grandRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;}
  .grandRow:last-child{border-bottom:none;}
  .grandRow b{font-family:'Sora',sans-serif;color:var(--gold);}

  /* collapsible cards + rows */
  details.card{padding:0;overflow:hidden;}
  details.card > summary{
    padding:20px;cursor:pointer;list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  details.card > summary::-webkit-details-marker{display:none;}
  details.card > summary::marker{content:"";}
  details.card > summary h3{margin:0;}
  details.card > summary .chev{color:var(--muted);font-size:12px;transition:transform .15s ease;}
  details.card[open] > summary .chev{transform:rotate(180deg);}
  details.card > .cardBody{padding:0 20px 20px;}

  .periodRow[open] .periodChev{transform:rotate(180deg);display:inline-block;}
  .periodChev{display:inline-block;transition:transform .15s ease;font-size:10px;color:var(--muted);}
  .periodRow summary{cursor:pointer;list-style:none;}
  .periodRow summary::-webkit-details-marker{display:none;}
  .periodRow summary::marker{content:"";}
  .periodDetail{
    background:var(--surface);
    border-radius:10px;
    padding:4px 12px;
    margin:2px 0 8px;
  }
  .periodDetail .pOrder{padding:9px 0;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);}
  .periodDetail .pOrder:first-child{border-top:none;}
  .periodDetail .pOrder .pMain{color:var(--text);}

  /* custom confirm modal */
  .modalOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .modalBox{
    background:var(--surface);border:1px solid var(--accent);border-radius:16px;
    padding:22px;max-width:340px;width:100%;
  }
  .modalBox p{margin:0 0 20px;font-size:14.5px;line-height:1.7;color:var(--text);}
  .modalBox .row2{display:flex;gap:10px;}
</style>
</head>
<body>
<canvas id="starsCanvas"></canvas>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="authCard">
    <div class="brandRow">
      <img class="logoImg" id="logoImgAuth" alt="Lucifer Exchange">
      <p class="brand">LUCIFER</p>
    </div>
    <p class="subBrand">E X C H A N G E — دفتر المتجر</p>
    <p class="sub" id="authSub">سجل دخولك لمتابعة الطلبات والأرباح</p>

    <div class="field">
      <label>الإيميل</label>
      <input type="email" id="emailInput" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>الباسورد</label>
      <input type="password" id="passInput" placeholder="••••••••">
    </div>
    <button class="btn" id="authSubmitBtn">دخول</button>
    <div id="authError"></div>
    <div class="switchRow" id="switchRow">
      ماعندك حساب؟ <a id="toSignup">سوي حساب جديد</a>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="wrap">
    <header class="topbar">
      <div class="row">
        <div class="brandRow">
          <img class="logoImg" id="logoImgTop" alt="Lucifer Exchange">
          <div>
            <div class="brand" style="font-size:16px;line-height:1.2;">LUCIFER</div>
            <div style="font-size:10px;letter-spacing:.12em;color:var(--muted);">EXCHANGE</div>
          </div>
        </div>
        <div class="userChip">
          <span id="userEmailLabel"></span>
          <span class="roleTag" id="roleLabel"></span>
          <button class="signOutBtn" id="signOutBtn">خروج</button>
        </div>
      </div>
    </header>

    <nav class="tabs" id="tabsNav"></nav>

    <div id="sectionContent"></div>
  </div>
</div>

/* -------- خلفية النجوم المتساقطة المتلألئة -------- */
function startStarfield() {
  const canvas = document.getElementById("starsCanvas");
  const ctx = canvas.getContext("2d");
  let w, h, stars;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function makeStars() {
    const count = Math.min(110, Math.floor((w * h) / 9000));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.4 + 0.4,
      speed: Math.random() * 0.35 + 0.08,
      phase: Math.random() * Math.PI * 2,
      twinkleSpeed: Math.random() * 0.02 + 0.01
    }));
  }
  resize();
  makeStars();
  window.addEventListener("resize", () => { resize(); makeStars(); });

  function tick() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.y += s.speed;
      s.phase += s.twinkleSpeed;
      if (s.y > h) { s.y = -2; s.x = Math.random() * w; }
      const twinkle = (Math.sin(s.phase) + 1) / 2; // 0..1
      const alpha = 0.15 + twinkle * 0.65;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(245,182,13,${alpha.toFixed(2)})`;
      ctx.shadowColor = "rgba(255,212,71,0.8)";
      ctx.shadowBlur = twinkle * 4;
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
}

function showConfirmModal(message) {
  return new Promise(resolve => {
    const overlay = document.createElement("div");
    overlay.className = "modalOverlay";
    overlay.innerHTML = `
      <div class="modalBox">
        <p>${message}</p>
        <div class="row2">
          <button class="btn" id="confirmYesBtn">تأكيد</button>
          <button class="btn ghost" id="confirmNoBtn">إلغاء</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector("#confirmYesBtn").addEventListener("click", () => { overlay.remove(); resolve(true); });
    overlay.querySelector("#confirmNoBtn").addEventListener("click", () => { overlay.remove(); resolve(false); });
  });
}

authSubmitBtn.addEventListener("click", async () => {
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passInput").value;
  authError.textContent = "";
  if (!email || !pass) { authError.textContent = "لازم تعبي الإيميل والباسورد"; return; }
  try {
    if (mode === "login") {
      await signInWithEmailAndPassword(auth, email, pass);
    } else {
      await createUserWithEmailAndPassword(auth, email, pass);
    }
  } catch (e) {
    authError.textContent = translateAuthError(e.code);
  }
});

function translateAuthError(code) {
  const map = {
    "auth/invalid-email": "الإيميل غير صحيح",
    "auth/user-not-found": "ماكو حساب بهذا الإيميل",
    "auth/wrong-password": "الباسورد غلط",
    "auth/invalid-credential": "بيانات الدخول غلط",
    "auth/email-already-in-use": "هذا الإيميل مسجل من قبل",
    "auth/weak-password": "الباسورد لازم 6 أحرف أو أكثر"
  };
  return map[code] || "صار خطأ، حاول مرة ثانية";
}

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    isManager = MANAGER_EMAILS.includes(user.email);
    document.getElementById("authScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("userEmailLabel").textContent = user.email;
    document.getElementById("roleLabel").textContent = isManager ? "مدير" : "عضو";
    buildTabs();
    renderSection();
  } else {
    document.getElementById("authScreen").style.display = "flex";
    document.getElementById("app").style.display = "none";
    if (unsubscribeOrders) unsubscribeOrders();
  }
});

/* ---------------- Tabs ---------------- */
function buildTabs() {
  const nav = document.getElementById("tabsNav");
  nav.innerHTML = "";
  const tabList = [...SECTIONS];
  if (isManager) tabList.push({ id: "totals", label: "الإجمالي" });
  tabList.forEach(s => {
    const btn = document.createElement("button");
    btn.textContent = s.label;
    btn.className = s.id === activeSection ? "active" : "";
    btn.addEventListener("click", () => {
      activeSection = s.id;
      editingOrderId = null;
      buildTabs();
      renderSection();
    });
    nav.appendChild(btn);
  });
}

        <input type="text" id="noteInput" placeholder="تفاصيل إضافية...">
      </div>
      <div class="profitPreview">
        <span>الربح</span>
        <b id="profitPreviewVal" class="pos">0</b>
      </div>
      <button class="btn" id="addOrderBtn">إضافة الطلب</button>
    </div>

    <div class="totalsBar" id="sectionTotals">
      <div><b id="totalCount">0</b>عدد الطلبات</div>
      <div><b id="totalProfit">0</b>مجموع الربح</div>
    </div>

    <details class="card">
      <summary><h3>الربح حسب اليوم</h3><span class="chev">▾</span></summary>
      <div class="cardBody" id="dailyBreakdown"></div>
    </details>

    <details class="card">
      <summary><h3>الربح حسب الأسبوع</h3><span class="chev">▾</span></summary>
      <div class="cardBody" id="weeklyBreakdown"></div>
    </details>

    <div id="orderList"></div>
  `;

  const costEl = document.getElementById("costInput");
  const sellEl = document.getElementById("sellInput");
  const previewEl = document.getElementById("profitPreviewVal");

  function updatePreview() {
    const c = parseFloat(costEl.value) || 0;
    const s = parseFloat(sellEl.value) || 0;
    const p = s - c;
    previewEl.textContent = p.toLocaleString();
    previewEl.className = p >= 0 ? "pos" : "neg";
  }
  costEl.addEventListener("input", updatePreview);
  sellEl.addEventListener("input", updatePreview);

  document.getElementById("addOrderBtn").addEventListener("click", async () => {
    const cost = parseFloat(costEl.value);
    const sell = parseFloat(sellEl.value);
    if (isNaN(cost) || isNaN(sell)) { alert("لازم تكتب سعر التكلفة وسعر البيع"); return; }
    const note = document.getElementById("noteInput").value.trim();
    const buyerName = document.getElementById("buyerInput").value.trim();
    const ticketNumber = document.getElementById("ticketInput").value.trim();
    const pointsRaw = document.getElementById("pointsInput").value;
    const points = pointsRaw === "" ? null : Number(pointsRaw);
    const accountType = section.extraField ? document.getElementById("accountTypeInput").value.trim() : null;

    await addDoc(collection(db, "orders"), {
      section: section.id,
      cost, sell,
      profit: sell - cost,
      note: note || null,
      buyerName: buyerName || null,
      ticketNumber: ticketNumber || null,
      points: points,
      accountType: accountType || null,
      createdBy: currentUser.email,
      createdByUid: currentUser.uid,
      createdAt: serverTimestamp()
    });

    costEl.value = ""; sellEl.value = ""; document.getElementById("noteInput").value = "";
    document.getElementById("buyerInput").value = ""; document.getElementById("ticketInput").value = ""; document.getElementById("pointsInput").value = "";
    if (section.extraField) document.getElementById("accountTypeInput").value = "";
    updatePreview();
  });

  subscribeToOrders(section);
}

function subscribeToOrders(section) {
  let q;
  if (isManager) {
    q = query(collection(db, "orders"), where("section", "==", section.id), orderBy("createdAt", "desc"));
  } else {
    q = query(collection(db, "orders"),
      where("section", "==", section.id),
      where("createdByUid", "==", currentUser.uid),
      orderBy("createdAt", "desc"));
  }
  unsubscribeOrders = onSnapshot(q, (snap) => {
    currentOrders = [];
    snap.forEach(d => currentOrders.push({ id: d.id, ...d.data() }));
    renderOrderList(section);
  });
}

function dayKeyOf(date) {
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" + String(date.getDate()).padStart(2, "0");
}
function weekStartOf(date) {
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  d.setDate(d.getDate() - d.getDay()); // Sunday = start of week
  return d;
}
function weekKeyOf(date) {
  return dayKeyOf(weekStartOf(date));
}
function weekLabelOf(key) {
  const [y, m, d] = key.split("-").map(Number);
  const start = new Date(y, m - 1, d);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  const opts = { day: "numeric", month: "long" };
  return `الأسبوع ${start.toLocaleDateString("ar-IQ", opts)} — ${end.toLocaleDateString("ar-IQ", opts)}`;
}
function monthKeyOf(date) {
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
}
function monthLabelOf(key) {
  const [y, m] = key.split("-").map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString("ar-IQ", { month: "long", year: "numeric" });
}

function renderOrderList(section) {
  const listEl = document.getElementById("orderList");
  const totalCountEl = document.getElementById("totalCount");
  const totalProfitEl = document.getElementById("totalProfit");
  if (!listEl) return;

  const totalProfit = currentOrders.reduce((sum, o) => sum + (o.profit || 0), 0);
  totalCountEl.textContent = currentOrders.length;
  totalProfitEl.textContent = totalProfit.toLocaleString();
  renderDailyBreakdown();

  if (currentOrders.length === 0) {
    listEl.innerHTML = `<div class="emptyState">ماكو طلبات مسجلة بعد بهذا القسم</div>`;
    return;
  }

  listEl.innerHTML = currentOrders.map(o => {
    if (o.id === editingOrderId) return renderEditForm(o, section);

    const isPos = o.profit >= 0;
    const date = o.createdAt?.toDate ? o.createdAt.toDate().toLocaleDateString("ar-IQ") : "";
    const canDelete = isManager || o.createdByUid === currentUser.uid;
    return `
      <div class="orderRow">
        <div class="top">
          <div class="nums">تكلفة ${o.cost.toLocaleString()} · بيع ${o.sell.toLocaleString()}</div>
          <div class="profitVal ${isPos ? "pos" : "neg"}">${o.profit.toLocaleString()}</div>
        </div>
        ${o.accountType ? `<div class="note">نوع الحساب: ${escapeHtml(o.accountType)}</div>` : ""}
        ${o.buyerName ? `<div class="note">الزبون: ${escapeHtml(o.buyerName)}</div>` : ""}
        ${o.ticketNumber ? `<div class="note">التكت: #${escapeHtml(o.ticketNumber)}</div>` : ""}
        ${(o.points !== null && o.points !== undefined) ? `<div class="note">النقاط: ${o.points.toLocaleString()}</div>` : ""}
        ${o.note ? `<div class="note">${escapeHtml(o.note)}</div>` : ""}
        <div class="meta">${date}${isManager ? " · أكدها: " + o.createdBy : ""}</div>
        <div class="actions" style="display:flex;gap:14px;">
          ${isManager ? `<button class="delBtn" data-edit="${o.id}" style="color:var(--gold);">تعديل</button>` : ""}
          ${canDelete ? `<button class="delBtn" data-id="${o.id}">حذف</button>` : ""}
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".delBtn[data-id]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (await showConfirmModal("متأكد تريد تحذف هذا الطلب؟")) {
        await deleteDoc(doc(db, "orders", btn.dataset.id));
      }
    });
  });

  listEl.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      editingOrderId = btn.dataset.edit;
      renderOrderList(section);
    });
  });

  const cancelBtn = document.getElementById("cancelEditBtn");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { editingOrderId = null; renderOrderList(section); });

  const saveBtn = document.getElementById("saveEditBtn");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const id = saveBtn.dataset.id;
    const cost = parseFloat(document.getElementById("editCost").value);
    const sell = parseFloat(document.getElementById("editSell").value);
    if (isNaN(cost) || isNaN(sell)) { alert("لازم تكتب سعر التكلفة وسعر البيع"); return; }
    const updates = {
      cost, sell, profit: sell - cost,
      note: document.getElementById("editNote").value.trim() || null,
      buyerName: document.getElementById("editBuyer").value.trim() || null,
      ticketNumber: document.getElementById("editTicket").value.trim() || null,
      points: document.getElementById("editPoints").value === "" ? null : Number(document.getElementById("editPoints").value)
    };
    if (section.extraField) updates.accountType = document.getElementById("editAccountType").value.trim() || null;
    await updateDoc(doc(db, "orders", id), updates);
    editingOrderId = null;
  });
}

function renderEditForm(o, section) {
  return `
    <div class="orderRow" style="border-color:var(--accent);">
      <h3 style="margin:0 0 12px;font-size:14px;color:var(--gold);">تعديل الطلب</h3>
      ${section.extraField ? `
      <div class="field"><label>نوع الحساب</label><input type="text" id="editAccountType" value="${escapeAttr(o.accountType || "")}"></div>` : ""}
      <div class="grid2">
        <div class="field"><label>سعر التكلفة</label><input type="number" id="editCost" value="${o.cost}"></div>
        <div class="field"><label>سعر البيع</label><input type="number" id="editSell" value="${o.sell}"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>اسم/آيدي الزبون</label><input type="text" id="editBuyer" value="${escapeAttr(o.buyerName || "")}"></div>
        <div class="field"><label>رقم التكت</label><input type="text" id="editTicket" value="${escapeAttr(o.ticketNumber || "")}"></div>
      </div>
      <div class="field"><label>النقاط المعطاة</label><input type="number" id="editPoints" value="${o.points ?? ""}"></div>
      <div class="field"><label>ملاحظة</label><input type="text" id="editNote" value="${escapeAttr(o.note || "")}"></div>
      <div style="display:flex;gap:10px;margin-top:8px;">
        <button class="btn" id="saveEditBtn" data-id="${o.id}">حفظ</button>
        <button class="btn ghost" id="cancelEditBtn">إلغاء</button>
      </div>
    </div>
  `;
}

function renderOrderMiniList(orders) {
  return orders.map(o => {
    const color = o.profit >= 0 ? "var(--gold)" : "var(--danger)";
    return `
      <div class="pOrder">
        <div class="pMain">${o.sectionLabel ? escapeHtml(o.sectionLabel) + " — " : ""}تكلفة ${o.cost.toLocaleString()} · بيع ${o.sell.toLocaleString()} · <span style="color:${color};font-weight:700;">${o.profit.toLocaleString()}</span></div>
        ${o.buyerName ? `<div>الزبون: ${escapeHtml(o.buyerName)}</div>` : ""}
        ${o.ticketNumber ? `<div>التكت: #${escapeHtml(o.ticketNumber)}</div>` : ""}
        ${(o.points !== null && o.points !== undefined) ? `<div>النقاط: ${o.points}</div>` : ""}
        ${o.accountType ? `<div>نوع الحساب: ${escapeHtml(o.accountType)}</div>` : ""}
        ${o.note ? `<div>${escapeHtml(o.note)}</div>` : ""}
        ${o.createdBy ? `<div>أكدها: ${escapeHtml(o.createdBy)}</div>` : ""}
      </div>
    `;
  }).join("");
}

function renderPeriodRow(rowId, label, count, sum, orders) {
  const color = sum >= 0 ? "var(--gold)" : "var(--danger)";
  const isOpen = expandedRows.has(rowId);
  return `
    <details class="periodRow" data-row="${rowId}" ${isOpen ? "open" : ""}>
      <summary class="grandRow" style="margin:0;">
        <span>${label} (${count} طلب) <span class="chev periodChev">▾</span></span>
        <b style="color:${color}">${sum.toLocaleString()}</b>
      </summary>
      <div class="periodDetail">${renderOrderMiniList(orders)}</div>
    </details>
  `;
}

function wirePeriodToggles(box) {
  box.querySelectorAll(".periodRow").forEach(el => {
    el.addEventListener("toggle", () => {
      const id = el.dataset.row;
      if (el.open) expandedRows.add(id); else expandedRows.delete(id);
    });
  });
}

function renderDailyBreakdown() {
  const dayBox = document.getElementById("dailyBreakdown");
  const weekBox = document.getElementById("weeklyBreakdown");
  if (!dayBox || !weekBox) return;

  const days = {};
  const weeks = {};
  currentOrders.forEach(o => {
    const dt = o.createdAt?.toDate ? o.createdAt.toDate() : null;
    if (!dt) return;
    const dKey = dayKeyOf(dt);
    if (!days[dKey]) days[dKey] = { sum: 0, count: 0, dt, orders: [] };
    days[dKey].sum += o.profit || 0;
    days[dKey].count++;
    days[dKey].orders.push(o);

    const wKey = weekKeyOf(dt);
    if (!weeks[wKey]) weeks[wKey] = { sum: 0, count: 0, orders: [] };
    weeks[wKey].sum += o.profit || 0;
    weeks[wKey].count++;
    weeks[wKey].orders.push(o);
  });

  const dayKeys = Object.keys(days).sort().reverse();
  dayBox.innerHTML = dayKeys.length === 0 ? `<div class="emptyState">ماكو بيانات بعد</div>` :
    dayKeys.map(key => {
      const d = days[key];
      const label = d.dt.toLocaleDateString("ar-IQ", { day: "numeric", month: "long" });
      return renderPeriodRow("d-" + key, label, d.count, d.sum, d.orders);
    }).join("");
  wirePeriodToggles(dayBox);

  const weekKeys = Object.keys(weeks).sort().reverse();
  weekBox.innerHTML = weekKeys.length === 0 ? `<div class="emptyState">ماكو بيانات بعد</div>` :
    weekKeys.map(key => {
      const w = weeks[key];
      return renderPeriodRow("w-" + key, weekLabelOf(key), w.count, w.sum, w.orders);
    }).join("");
  wirePeriodToggles(weekBox);
}

/* ---------------- Grand totals (manager only) ---------------- */
function renderGrandTotals() {
  const grandBox = document.getElementById("grandBox");
  const monthlyLogBox = document.getElementById("monthlyLog");
  const weeklyLogBox = document.getElementById("weeklyLog");
  const dailyLogBox = document.getElementById("dailyLog");
  const curKey = monthKeyOf(new Date());
  document.getElementById("curMonthLabel").textContent = monthLabelOf(curKey);

  const unsubs = [];
  const sectionMonthly = {}; // sectionId -> { monthKey: {sum,count} }
  const sectionWeekly = {};  // sectionId -> { weekKey: {sum,count} }
  const sectionDaily = {};   // sectionId -> { dayKey: {sum,count} }
  const sectionCurMonth = {}; // sectionId -> {sum,count,label}
  const sectionRaw = {};     // sectionId -> [{profit, dt}]
  let settlements = [];
  let lastSettledAt = null;

  const settleQ = query(collection(db, "settlements"), orderBy("settledAt", "desc"));
  const settleUnsub = onSnapshot(settleQ, (snap) => {
    settlements = [];
    snap.forEach(d => settlements.push({ id: d.id, ...d.data() }));
    lastSettledAt = settlements[0]?.settledAt?.toDate ? settlements[0].settledAt.toDate() : null;
    draw();
  });
  unsubs.push(settleUnsub);

  document.getElementById("settleBtn").addEventListener("click", async () => {
    const allRaw = Object.values(sectionRaw).flat();
    const pending = allRaw.filter(o => !lastSettledAt || o.dt > lastSettledAt);
    const amount = pending.reduce((s, o) => s + o.profit, 0);
    if (pending.length === 0) { alert("ماكو ربح جديد للتصفية"); return; }
    if (!(await showConfirmModal(`راح تصفّي مبلغ ${amount.toLocaleString()} من ${pending.length} طلب. متأكد؟`))) return;
    await addDoc(collection(db, "settlements"), {
      amount,
      ordersCount: pending.length,
      settledBy: currentUser.email,
      settledAt: serverTimestamp()
    });
  });

  SECTIONS.forEach(s => {
    const q = query(collection(db, "orders"), where("section", "==", s.id));
    const unsub = onSnapshot(q, (snap) => {
      const monthly = {}, weekly = {}, daily = {};
      const raw = [];
      let curSum = 0, curCount = 0;
      snap.forEach(d => {
        const data = d.data();
        const dt = data.createdAt?.toDate ? data.createdAt.toDate() : null;
        if (!dt) return;
        const orderObj = { ...data, dt, sectionLabel: s.label };
        raw.push({ profit: data.profit || 0, dt });

        const mKey = monthKeyOf(dt);
        if (!monthly[mKey]) monthly[mKey] = { sum: 0, count: 0, orders: [] };
        monthly[mKey].sum += data.profit || 0;
        monthly[mKey].count++;
        monthly[mKey].orders.push(orderObj);

        const wKey = weekKeyOf(dt);
        if (!weekly[wKey]) weekly[wKey] = { sum: 0, count: 0, orders: [] };
        weekly[wKey].sum += data.profit || 0;
        weekly[wKey].count++;
        weekly[wKey].orders.push(orderObj);

        const dKey = dayKeyOf(dt);
        if (!daily[dKey]) daily[dKey] = { sum: 0, count: 0, dt, orders: [] };
        daily[dKey].sum += data.profit || 0;
        daily[dKey].count++;
        daily[dKey].orders.push(orderObj);

        if (mKey === curKey) { curSum += data.profit || 0; curCount++; }
      });
      sectionMonthly[s.id] = monthly;
      sectionWeekly[s.id] = weekly;
      sectionDaily[s.id] = daily;
      sectionRaw[s.id] = raw;
      sectionCurMonth[s.id] = { sum: curSum, count: curCount, label: s.label };
      draw();
    });
    unsubs.push(unsub);
  });
  unsubscribeOrders = () => unsubs.forEach(u => u());

  function mergePeriods(perSectionMap) {
    const merged = {};
    SECTIONS.forEach(s => {
      const map = perSectionMap[s.id] || {};
      Object.entries(map).forEach(([key, val]) => {
        if (!merged[key]) merged[key] = { sum: 0, count: 0, dt: val.dt, orders: [] };
        merged[key].sum += val.sum;
        merged[key].count += val.count;
        merged[key].orders.push(...val.orders);
      });
    });
    return merged;
  }

  function draw() {
    const allRaw = Object.values(sectionRaw).flat();
    const pending = allRaw.filter(o => !lastSettledAt || o.dt > lastSettledAt);
    const balance = pending.reduce((s, o) => s + o.profit, 0);
    const balEl = document.getElementById("settleBalance");
    if (balEl) {
      balEl.textContent = balance.toLocaleString();
      balEl.className = balance >= 0 ? "pos" : "neg";
    }

    const settleLogBox = document.getElementById("settleLog");
    if (settleLogBox) {
      settleLogBox.innerHTML = settlements.length === 0 ? `<div class="emptyState">ماكو تصفيات بعد</div>` :
        settlements.map(st => {
          const dt = st.settledAt?.toDate ? st.settledAt.toDate() : null;
          const label = dt ? dt.toLocaleDateString("ar-IQ", { day: "numeric", month: "long", year: "numeric" }) : "";
          return `<div class="grandRow"><span>${label} — ${st.ordersCount} طلب — ${escapeHtml(st.settledBy || "")}</span><b>${st.amount.toLocaleString()}</b></div>`;
        }).join("");
    }

    let curHtml = "";
    let grandCur = 0;
    SECTIONS.forEach(s => {
      const t = sectionCurMonth[s.id];
      if (!t) return;
      grandCur += t.sum;
      curHtml += `<div class="grandRow"><span>${t.label} (${t.count} طلب)</span><b>${t.sum.toLocaleString()}</b></div>`;
    });
    curHtml += `<div class="grandRow" style="border-top:2px solid var(--accent);margin-top:6px;padding-top:12px;"><span>إجمالي الشهر</span><b>${grandCur.toLocaleString()}</b></div>`;
    grandBox.innerHTML = curHtml;

    const allMonths = mergePeriods(sectionMonthly);
    const monthKeys = Object.keys(allMonths).sort().reverse();
    monthlyLogBox.innerHTML = monthKeys.length === 0 ? `<div class="emptyState">ماكو بيانات بعد</div>` :
      monthKeys.map(key => {
        const t = allMonths[key];
        const isCur = key === curKey;
        const label = monthLabelOf(key) + (isCur ? " (الشهر الحالي)" : "");
        return renderPeriodRow("gm-" + key, label, t.count, t.sum, t.orders);
      }).join("");
    wirePeriodToggles(monthlyLogBox);

    const allWeeks = mergePeriods(sectionWeekly);
    const weekKeys = Object.keys(allWeeks).sort().reverse().slice(0, 16);
    weeklyLogBox.innerHTML = weekKeys.length === 0 ? `<div class="emptyState">ماكو بيانات بعد</div>` :
      weekKeys.map(key => renderPeriodRow("gw-" + key, weekLabelOf(key), allWeeks[key].count, allWeeks[key].sum, allWeeks[key].orders)).join("");
    wirePeriodToggles(weeklyLogBox);

    const allDays = mergePeriods(sectionDaily);
    const dayKeys = Object.keys(allDays).sort().reverse().slice(0, 20);
    dailyLogBox.innerHTML = dayKeys.length === 0 ? `<div class="emptyState">ماكو بيانات بعد</div>` :
      dayKeys.map(key => {
        const t = allDays[key];
        const label = t.dt.toLocaleDateString("ar-IQ", { day: "numeric", month: "long" });
        return renderPeriodRow("gd-" + key, label, t.count, t.sum, t.orders);
      }).join("");
    wirePeriodToggles(dailyLogBox);
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
function escapeAttr(str) {
  return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
